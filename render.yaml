# Minimal Render blueprint for the first AI-host test (proof of concept, no custom domain).
# Render deploys from a Git repository; see README "Deploying to Render".
services:
  - type: web
    name: clp-health-intelligence
    runtime: node
    # Starter avoids the free tier's idle spin-down, which can break a connector's first handshake.
    plan: starter
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: HOST
        value: 0.0.0.0
      # Render injects PORT and RENDER_EXTERNAL_HOSTNAME automatically; the server allows that hostname.
      - key: TRUST_PROXY
        value: "false"
      - key: MAX_BODY_BYTES
        value: "65536"
      - key: RATE_LIMIT_PER_MINUTE
        value: "120"
      # Leave unset until the real booking link is approved; the CTA button is then disabled.
      - key: CLP_CONSULTATION_URL
        sync: false

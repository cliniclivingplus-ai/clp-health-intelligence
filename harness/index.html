<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CLP MCP Apps test host</title>
<style>
  body { font:14px/1.4 system-ui,sans-serif; margin:0; padding:16px; background:#eef1f4; color:#1b2430; }
  h1 { font-size:16px; margin:0 0 4px; } p.sub { margin:0 0 12px; color:#5b6675; }
  form { display:flex; gap:8px; flex-wrap:wrap; align-items:end; margin-bottom:12px; }
  label { display:flex; flex-direction:column; font-size:12px; color:#5b6675; gap:2px; }
  input, select, button { font:inherit; padding:6px 8px; }
  .layout { display:grid; grid-template-columns: minmax(300px, 520px) 1fr; gap:16px; }
  @media (max-width:900px) { .layout { grid-template-columns:1fr; } }
  #frame-holder { background:#fff; border:1px dashed #b8c0ca; border-radius:8px; padding:8px; min-height:60px; }
  pre { margin:0; background:#101418; color:#b9e4c9; padding:10px; border-radius:8px; height:340px; overflow:auto; font-size:12px; }
</style>
</head>
<body>
<h1>CLP MCP Apps — local test host</h1>
<p class="sub">Spawns the real MCP server over stdio, fetches the ui:// card, and renders it with the official AppBridge.</p>
<form onsubmit="return false">
  <label>Age <input id="age" type="number" value="45" min="1" max="120" style="width:70px"></label>
  <label>Sex <select id="sex"><option>male</option><option>female</option></select></label>
  <label>Creatinine <input id="creatinine" type="number" step="0.01" value="1.5" style="width:90px"></label>
  <label>Unit <select id="unit"><option>mg/dL</option><option>umol/L</option></select></label>
  <button id="run" type="button">Run tool</button>
</form>
<div class="layout">
  <div><div id="frame-holder"></div></div>
  <pre id="log"></pre>
</div>
<script src="/host.js"></script>
</body>
</html>

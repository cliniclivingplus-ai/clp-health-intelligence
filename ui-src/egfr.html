<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CLP eGFR Result</title>
<style>
  :root { color-scheme: light dark; --bg:#fff; --fg:#1b2430; --muted:#5b6675; --line:#dfe4ea; --card:#f6f8fa; --accent:#0f6b5c; }
  @media (prefers-color-scheme: dark) { :root { --bg:#14181d; --fg:#e8ecf1; --muted:#9aa6b4; --line:#2b333d; --card:#1c222a; --accent:#3fb59f; } }
  * { box-sizing: border-box; }
  body { margin:0; padding:16px; background:transparent; color:var(--fg); font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
  .card { max-width:480px; margin:0 auto; border:1px solid var(--line); border-radius:14px; background:var(--card); padding:20px; }
  .brand { font-size:12px; letter-spacing:.06em; text-transform:uppercase; color:var(--muted); }
  h1 { font-size:16px; margin:2px 0 14px; font-weight:600; }
  .value { display:flex; align-items:baseline; gap:8px; flex-wrap:wrap; }
  .num { font-size:52px; font-weight:700; line-height:1; }
  .unit { color:var(--muted); font-size:14px; }
  .badge { display:inline-block; margin-top:12px; padding:3px 10px; border-radius:999px; font-size:13px; font-weight:600; color:#fff; background:#5b6675; }
  .badge[data-severity="normal"] { background:#1a7f4b; }
  .badge[data-severity="follow_up"] { background:#a86400; }
  .badge[data-severity="concerning"] { background:#c2410c; }
  .badge[data-severity="urgent"] { background:#b91c1c; }
  .desc { color:var(--muted); font-size:14px; margin-left:6px; }
  .guidance { margin:16px 0 0; }
  .note { margin:14px 0 0; padding:10px 12px; border-left:3px solid var(--accent); background:var(--bg); border-radius:4px; font-size:13px; color:var(--muted); }
  .note strong { color:var(--fg); }
  .cta { margin-top:16px; }
  .cta button { width:100%; padding:12px 16px; border:0; border-radius:10px; background:var(--accent); color:#fff; font:600 15px system-ui,sans-serif; cursor:pointer; }
  .cta button:disabled { opacity:.5; cursor:not-allowed; }
  .cta small { display:block; margin-top:6px; color:var(--muted); font-size:12px; }
  .disclaimer { margin:14px 0 0; font-size:12px; color:var(--muted); }
  .status { text-align:center; color:var(--muted); padding:24px 0; }
  [hidden] { display:none !important; }
</style>
</head>
<body>
<div class="card" aria-live="polite">
  <div class="brand">CLP Health Intelligence</div>
  <h1>Estimated GFR (eGFR)</h1>
  <div class="status" id="status">Waiting for result…</div>
  <div id="result" hidden>
    <div class="value"><span class="num" id="egfr"></span><span class="unit" id="unit"></span></div>
    <div><span class="badge" id="badge"></span><span class="desc" id="catdesc"></span></div>
    <p class="guidance" id="guidance"></p>
    <div class="note"><strong>Important:</strong> <span id="clinicalNote"></span></div>
    <div class="cta" id="cta" hidden>
      <button type="button" id="ctaBtn"></button>
      <small id="ctaHint" hidden>Consultation link not configured yet.</small>
    </div>
    <p class="disclaimer" id="disclaimer"></p>
  </div>
</div>
<!--APP_SCRIPT-->
</body>
</html>
